name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://username:$HF_TOKEN@huggingface.co/spaces/Superuj/RAG
          git push --force space master:main
