[project]
name = "reading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Superuj1986", email = "dotuanlong2209@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "llama-index>=0.14.25",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-google-genai>=0.11.3",
    "llama-index-llms-openai>=0.7.10",
    "llama-index-postprocessor-sbert-rerank>=0.6.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "trulens>=2.16.0",
    "trulens-providers-openai>=2.16.0",
]

[project.scripts]
reading = "reading:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reading"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
